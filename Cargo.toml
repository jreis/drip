[package]
name = "drip"
version = "0.1.0"
edition = "2024"
description = "Local-first TUI for Raindrop.io bookmarks — search, filter, sync, and actually revisit them"
license = "MIT"
readme = "README.md"
keywords = ["raindrop", "bookmarks", "tui", "ratatui", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/jreis/drip"
homepage = "https://github.com/jreis/drip"
documentation = "https://github.com/jreis/drip#readme"
exclude = ["target/", ".github/workflows/*.log"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
open = "5.4.0"
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
